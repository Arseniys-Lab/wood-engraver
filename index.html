<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wood Engraving G-code Generator v4.4.0 - Arseniy's Lab</title>
    <meta name="description" content="Turn your 3D printer into a wood and leather engraver: convert an image into G-code that burns it with the hot nozzle. Free, runs in your browser.">
    <link rel="icon" href="vendor/lab/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="vendor/lab/lab.css">
    <script src="vendor/lab/lab-nav.js" defer></script>

    <!-- Exact versions: an unpinned CDN update must not break the app. -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.11/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script>
        // Arseniy's Lab "workshop" palette, dark variant (charcoal + ember).
        // Existing Tailwind classes keep working: grays become warm charcoal,
        // every accent hue (blue, purple, indigo, cyan, green) becomes ember.
        const ember = {
            50: '#fdf3ed', 100: '#fbe3d6', 200: '#f6c3a8', 300: '#f2a57f', 400: '#e98a5f',
            500: '#d9603a', 600: '#c4532f', 700: '#a4472b', 800: '#7c3420', 900: '#4a2014', 950: '#2b130c'
        };
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gray: {
                            50: '#f7f2ea', 100: '#efe6da', 200: '#ddd1c3', 300: '#c2b4a5', 400: '#a99b8d',
                            500: '#857869', 600: '#54473e', 700: '#3a312b', 800: '#201b18', 900: '#161311', 950: '#0f0d0c'
                        },
                        blue: ember, purple: ember, indigo: ember, cyan: ember, green: ember,
                        red: {
                            200: '#f8c4bc', 400: '#f07060', 500: '#e05a4a', 600: '#b3362b', 700: '#922b22', 800: '#6e2019', 900: '#3f130f'
                        },
                        yellow: { 400: '#e0a645', 600: '#a86b12', 700: '#8a5a12' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'SF Mono', 'Menlo', 'monospace']
                    }
                }
            }
        };
    </script>
</head>
<body>
    <div id="root"></div>

    <!-- Load utility modules first -->
    <script type="text/babel" src="./src/utils/transforms.js"></script>
    <script type="text/babel" src="./src/utils/imageProcessing.js"></script>
    <script type="text/babel" src="./src/utils/gcodeGenerator.js"></script>
    <script type="text/babel" src="./src/utils/gcodeParser.js"></script>
    <script type="text/babel" src="./src/utils/qrcode.js"></script>

    <!-- Load hooks -->
    <script type="text/babel" src="./src/hooks/useHistory.js"></script>

    <!-- Load components -->
    <script type="text/babel" src="./src/components/modals/GcodeModal.jsx"></script>
    <script type="text/babel" src="./src/components/modals/TestGridModal.jsx"></script>
    <script type="text/babel" src="./src/components/modals/ImportModal.jsx"></script>
    <script type="text/babel" src="./src/components/modals/QRCodeModal.jsx"></script>
    <script type="text/babel" src="./src/components/LabHeader.jsx"></script>
    <script type="text/babel" src="./src/components/Canvas.jsx"></script>
    <script type="text/babel" src="./src/components/Toolbar.jsx"></script>
    <script type="text/babel" src="./src/components/Sidebar.jsx"></script>

    <!-- Load main App -->
    <script type="text/babel" src="./src/App.jsx"></script>

    <!-- Initialize -->
    <script type="text/babel">
        const { App } = window;
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
